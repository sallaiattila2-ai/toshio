<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOSHIO 0.4</title><style>body{font-family:system-ui;background:#101820;color:#fff;margin:0;padding:30px;max-width:650px}button{font-size:19px;padding:15px;margin:8px 5px 8px 0;border:0;border-radius:12px;background:#20b8aa;color:#061c20}#status,#heard{padding:12px;background:#23313b;border-radius:10px;margin-top:15px}small{color:#bac7cd}</style></head><body><h1>TOSHIO 0.4</h1><p>Magyar hangvezérlés – kísérleti változat</p><button id="listen">🎤 Beszéd indítása</button><button id="stop">Leállítás</button><button id="time">Mennyi az idő?</button><div id="status" role="status">Állapot: készenlét</div><div id="heard">Felismert szöveg: –</div><p><small>Próbáld: „mennyi az idő”, „nyisd meg a YouTube-ot”, „navigálj Budapestre”. A böngésző kérhet mikrofonengedélyt. A hangfelismeréshez internetkapcsolat is szükséges lehet.</small></p><script>
const status=document.getElementById('status'),heard=document.getElementById('heard');const set=s=>status.textContent='Állapot: '+s;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
function respond(t){const s=t.toLocaleLowerCase('hu-HU');if(s.includes('idő')||s.includes('óra')){set('Most '+new Date().toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'}));}else if(s.includes('youtube')){set('YouTube megnyitása…');window.open('https://www.youtube.com/','_blank');}else if(s.includes('waze')||s.includes('navigálj')||s.includes('navigáció')){let place=s.replace(/.*?(navigálj|navigáció|waze)(\s+(ide|oda|a|az|to))?/,'').replace(/\s+(helyre|városba|felé)$/,'').trim();set('Waze megnyitása'+(place?' – '+place:''));window.open('https://waze.com/ul?'+(place?'q='+encodeURIComponent(place)+'&':'')+'navigate=yes','_blank');}else set('Hallottam, de még nem ismerem ezt a parancsot.');}
document.getElementById('time').onclick=()=>respond('mennyi az idő');document.getElementById('listen').onclick=()=>{if(!SR){set('HIBA: ez a böngésző nem támogatja a SpeechRecognition funkciót. Próbáld Chrome-ban.');return;}try{if(rec){rec.abort();}rec=new SR();rec.lang='hu-HU';rec.interimResults=false;rec.continuous=false;rec.onstart=()=>set('Figyelek… beszélj!');rec.onresult=e=>{let t=e.results[0][0].transcript;heard.textContent='Felismert szöveg: '+t;respond(t)};rec.onerror=e=>set('HIBA: '+e.error+' – '+(e.message||'ellenőrizd a mikrofonengedélyt és az internetkapcsolatot'));rec.onend=()=>{if(status.textContent.includes('Figyelek'))set('A figyelés véget ért. Próbáld újra.');};set('Mikrofon indítása…');rec.start();}catch(e){set('HIBA: '+e.message)}};document.getElementById('stop').onclick=()=>{if(rec)rec.abort();set('Leállítva')};
</script></body></html>
